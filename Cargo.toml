[package]
name = "easy-tunnel"
version = "0.1.0"
edition = "2024"
description = "A small macOS menu bar app for SSH tunnels"
license = "MIT"

[lib]
name = "easy_tunnel"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"
shlex = "1"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

# Rust 1.97.1 can produce invalid Mach-O proc-macro libraries when stripping.
# https://github.com/rust-lang/rust/issues/157750
[profile.release]
strip = "none"
